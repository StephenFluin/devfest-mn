# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
# env:
# Configure environment variables.
# See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
# - variable: MESSAGE
#   value: Hello world!
#   availability:
#     - BUILD
#     - RUNTIME

# Grant access to secrets in Cloud Secret Manager.
# See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
# - variable: MY_SECRET
#   secret: mySecretRef

env:
  # Eventbrite private token used by /api/admin/burndown/update. Create it once with:
  #   firebase apphosting:secrets:set eventbriteToken
  - variable: EVENTBRITE_TOKEN
    secret: eventbriteToken
    availability:
      - RUNTIME
  # Resend API key used to email speaker invites (src/mailer.ts). Create it once with:
  #   npx firebase apphosting:secrets:set resendApiKey
  - variable: RESEND_API_KEY
    secret: resendApiKey
    availability:
      - RUNTIME
  # Must be on a domain verified in Resend.
  - variable: MAIL_FROM
    value: DevFestMN <info@devfest.mn>
    availability:
      - RUNTIME
