@if (auth.uid() && environment.showFeedback) {
  <div>
    <div>How would you rate this speaker?</div>
    <app-star-bar
      (newSelection)="saveSpeaker($event)"
      [selected]="feedback().speaker"
    ></app-star-bar>
    <div>How would you rate the content?</div>
    <app-star-bar
      (newSelection)="saveContent($event)"
      [selected]="feedback().content"
    ></app-star-bar>
    <div>Would you recommend this session?</div>
    <app-star-bar
      (newSelection)="saveRecommendation($event)"
      [selected]="feedback().recommendation"
    ></app-star-bar>
    <div>Comments</div>
    <input
      #feedbackComment
      (blur)="saveComment(feedbackComment.value)"
      [value]="feedback().comment || ''"
    />
    <input
      type="submit"
      (click)="save()"
      [value]="saveButtonText()"
      [disabled]="saveButtonDisabled()"
    />
  </div>
} @else if (environment.showFeedback) {
  <button (click)="auth.login()" mat-raised-button color="primary">
    Login to provide feedback
  </button>
}
